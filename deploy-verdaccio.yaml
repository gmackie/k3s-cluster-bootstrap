apiVersion: v1
kind: Namespace
metadata:
  name: npm-registry
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: verdaccio-config
  namespace: npm-registry
data:
  config.yaml: |
    storage: /verdaccio/storage
    auth:
      htpasswd:
        file: /verdaccio/storage/htpasswd
    uplinks:
      npmjs:
        url: https://registry.npmjs.org/
    packages:
      '@*/*':
        access: $authenticated
        publish: $authenticated
        unpublish: $authenticated
        proxy: npmjs
      '**':
        access: $authenticated
        publish: $authenticated
        unpublish: $authenticated
        proxy: npmjs
    server:
      keepAliveTimeout: 60
    middlewares:
      audit:
        enabled: true
    logs:
      - {type: stdout, format: pretty, level: http}
    web:
      enable: true
      title: GMAC Private NPM Registry
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: verdaccio-storage
  namespace: npm-registry
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: verdaccio
  namespace: npm-registry
spec:
  replicas: 1
  selector:
    matchLabels:
      app: verdaccio
  template:
    metadata:
      labels:
        app: verdaccio
    spec:
      containers:
      - name: verdaccio
        image: verdaccio/verdaccio:5
        ports:
        - containerPort: 4873
          name: http
        env:
        - name: VERDACCIO_PORT
          value: "4873"
        - name: VERDACCIO_PROTOCOL
          value: "http"
        volumeMounts:
        - name: config
          mountPath: /verdaccio/conf
        - name: storage
          mountPath: /verdaccio/storage
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi
      volumes:
      - name: config
        configMap:
          name: verdaccio-config
      - name: storage
        persistentVolumeClaim:
          claimName: verdaccio-storage
---
apiVersion: v1
kind: Service
metadata:
  name: verdaccio
  namespace: npm-registry
spec:
  selector:
    app: verdaccio
  ports:
  - port: 4873
    targetPort: 4873
    name: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: verdaccio
  namespace: npm-registry
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    # OAuth2 proxy for web UI
    nginx.ingress.kubernetes.io/auth-url: "http://oauth2-proxy.auth-system.svc.cluster.local:4180/oauth2/auth"
    nginx.ingress.kubernetes.io/auth-signin: "https://gmac.io/oauth2/start?rd=$scheme://$host$escaped_request_uri"
    # Skip auth for npm CLI
    nginx.ingress.kubernetes.io/configuration-snippet: |
      if ($http_user_agent ~* "npm|yarn|pnpm") {
        set $auth_header "";
      }
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - npm.gmac.io
    secretName: verdaccio-tls
  rules:
  - host: npm.gmac.io
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: verdaccio
            port:
              number: 4873
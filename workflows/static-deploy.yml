name: Deploy Static Site to K3s

on:
  push:
    branches: [ main, master ]

env:
  REGISTRY: ci.gmac.io
  IMAGE_NAME: ${{ gitea.repository }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Log in to Gitea Registry
      uses: docker/login-action@v2
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ gitea.actor }}
        password: ${{ secrets.GITEA_TOKEN }}

    - name: Create Nginx Dockerfile
      run: |
        if [ ! -f Dockerfile ]; then
          cat <<'EOF' > Dockerfile
        FROM nginx:alpine
        COPY . /usr/share/nginx/html
        RUN rm -f /usr/share/nginx/html/Dockerfile
        EXPOSE 80
        CMD ["nginx", "-g", "daemon off;"]
        EOF
        fi

    - name: Build and push Docker image
      uses: docker/build-push-action@v4
      with:
        context: .
        push: true
        tags: |
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

    - name: Deploy to K3s
      env:
        KUBECONFIG_CONTENT: ${{ secrets.KUBECONFIG }}
      run: |
        # Setup kubeconfig
        echo "$KUBECONFIG_CONTENT" | base64 -d > /tmp/kubeconfig
        export KUBECONFIG=/tmp/kubeconfig
        
        # Create deployment manifest
        cat <<EOF > deployment.yaml
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: ${{ github.event.repository.name }}
          namespace: production
          labels:
            app: ${{ github.event.repository.name }}
        spec:
          replicas: 2
          selector:
            matchLabels:
              app: ${{ github.event.repository.name }}
          template:
            metadata:
              labels:
                app: ${{ github.event.repository.name }}
            spec:
              containers:
              - name: nginx
                image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
                ports:
                - containerPort: 80
                resources:
                  requests:
                    memory: "32Mi"
                    cpu: "10m"
                  limits:
                    memory: "128Mi"
                    cpu: "100m"
              imagePullSecrets:
              - name: gitea-registry
        ---
        apiVersion: v1
        kind: Service
        metadata:
          name: ${{ github.event.repository.name }}
          namespace: production
        spec:
          selector:
            app: ${{ github.event.repository.name }}
          ports:
          - port: 80
            targetPort: 80
        ---
        apiVersion: networking.k8s.io/v1
        kind: Ingress
        metadata:
          name: ${{ github.event.repository.name }}
          namespace: production
          annotations:
            cert-manager.io/cluster-issuer: "letsencrypt-prod"
            nginx.ingress.kubernetes.io/ssl-redirect: "true"
        spec:
          ingressClassName: nginx
          tls:
          - hosts:
            - ${{ github.event.repository.name }}.gmac.io
            secretName: ${{ github.event.repository.name }}-tls
          rules:
          - host: ${{ github.event.repository.name }}.gmac.io
            http:
              paths:
              - path: /
                pathType: Prefix
                backend:
                  service:
                    name: ${{ github.event.repository.name }}
                    port:
                      number: 80
        EOF
        
        # Apply deployment
        kubectl apply -f deployment.yaml
        
        # Wait for deployment
        kubectl rollout status deployment/${{ github.event.repository.name }} \
          -n production \
          --timeout=300s
        
        echo "✅ Static site deployed to https://${{ github.event.repository.name }}.gmac.io"
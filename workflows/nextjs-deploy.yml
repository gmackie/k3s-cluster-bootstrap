name: Deploy Next.js to K3s

on:
  push:
    branches: [ main, master ]
  pull_request:
    types: [ opened, synchronize ]

env:
  REGISTRY: ci.gmac.io
  # Docker image names must be lowercase
  IMAGE_NAME: ${{ gitea.repository }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build Next.js app
      run: npm run build

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Log in to Gitea Registry
      uses: docker/login-action@v2
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ gitea.actor }}
        password: ${{ secrets.GITEA_TOKEN }}

    - name: Determine deployment environment
      id: deployment
      run: |
        if [[ "${{ github.ref }}" == "refs/heads/main" ]] || [[ "${{ github.ref }}" == "refs/heads/master" ]]; then
          echo "environment=production" >> $GITHUB_OUTPUT
          echo "replicas=2" >> $GITHUB_OUTPUT
          echo "url=${{ github.event.repository.name }}.gmac.io" >> $GITHUB_OUTPUT
        else
          PR_NUM=${{ github.event.pull_request.number }}
          echo "environment=staging" >> $GITHUB_OUTPUT
          echo "replicas=1" >> $GITHUB_OUTPUT
          echo "url=staging-pr-${PR_NUM}.gmac.io" >> $GITHUB_OUTPUT
        fi

    - name: Build and push Docker image
      uses: docker/build-push-action@v4
      with:
        context: .
        push: true
        tags: |
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
        build-args: |
          NEXT_PUBLIC_API_URL=https://api.gmac.io
        cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
        cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max

    - name: Install kubectl
      run: |
        curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
        sudo install -o root -g root -m 0755 kubectl /usr/local/bin/kubectl
        kubectl version --client

    - name: Deploy to K3s
      env:
        KUBECONFIG_CONTENT: ${{ secrets.KUBECONFIG }}
      run: |
        # Setup kubeconfig
        echo "$KUBECONFIG_CONTENT" | base64 -d > /tmp/kubeconfig
        export KUBECONFIG=/tmp/kubeconfig
        
        # Create deployment manifest
        cat <<EOF > deployment.yaml
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: ${{ github.event.repository.name }}
          namespace: ${{ steps.deployment.outputs.environment }}
          labels:
            app: ${{ github.event.repository.name }}
            environment: ${{ steps.deployment.outputs.environment }}
        spec:
          replicas: ${{ steps.deployment.outputs.replicas }}
          selector:
            matchLabels:
              app: ${{ github.event.repository.name }}
          template:
            metadata:
              labels:
                app: ${{ github.event.repository.name }}
            spec:
              containers:
              - name: app
                image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
                ports:
                - containerPort: 3000
                env:
                - name: NODE_ENV
                  value: production
                - name: PORT
                  value: "3000"
                resources:
                  requests:
                    memory: "128Mi"
                    cpu: "100m"
                  limits:
                    memory: "512Mi"
                    cpu: "500m"
              imagePullSecrets:
              - name: gitea-registry
        ---
        apiVersion: v1
        kind: Service
        metadata:
          name: ${{ github.event.repository.name }}
          namespace: ${{ steps.deployment.outputs.environment }}
        spec:
          selector:
            app: ${{ github.event.repository.name }}
          ports:
          - port: 80
            targetPort: 3000
        ---
        apiVersion: networking.k8s.io/v1
        kind: Ingress
        metadata:
          name: ${{ github.event.repository.name }}
          namespace: ${{ steps.deployment.outputs.environment }}
          annotations:
            cert-manager.io/cluster-issuer: "letsencrypt-prod"
            nginx.ingress.kubernetes.io/ssl-redirect: "true"
        spec:
          ingressClassName: nginx
          tls:
          - hosts:
            - ${{ steps.deployment.outputs.url }}
            secretName: ${{ github.event.repository.name }}-tls
          rules:
          - host: ${{ steps.deployment.outputs.url }}
            http:
              paths:
              - path: /
                pathType: Prefix
                backend:
                  service:
                    name: ${{ github.event.repository.name }}
                    port:
                      number: 80
        EOF
        
        # Apply deployment
        kubectl apply -f deployment.yaml
        
        # Wait for deployment
        kubectl rollout status deployment/${{ github.event.repository.name }} \
          -n ${{ steps.deployment.outputs.environment }} \
          --timeout=300s
        
        echo "✅ Deployed to https://${{ steps.deployment.outputs.url }}"

    - name: Comment PR with staging URL
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v6
      with:
        script: |
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: '🚀 Staging environment deployed to: https://${{ steps.deployment.outputs.url }}'
          })
name: Deploy Go Service to K3s

on:
  push:
    branches: [ main, master ]
  pull_request:
    types: [ opened, synchronize ]

env:
  REGISTRY: ci.gmac.io
  IMAGE_NAME: ${{ gitea.repository }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Setup Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.21'

    - name: Run tests
      run: go test -v ./...

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Log in to Gitea Registry
      uses: docker/login-action@v2
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ gitea.actor }}
        password: ${{ secrets.GITEA_TOKEN }}

    - name: Determine deployment environment
      id: deployment
      run: |
        if [[ "${{ github.ref }}" == "refs/heads/main" ]] || [[ "${{ github.ref }}" == "refs/heads/master" ]]; then
          echo "environment=production" >> $GITHUB_OUTPUT
          echo "replicas=3" >> $GITHUB_OUTPUT
          echo "url=api.gmac.io" >> $GITHUB_OUTPUT
        else
          PR_NUM=${{ github.event.pull_request.number }}
          echo "environment=staging" >> $GITHUB_OUTPUT
          echo "replicas=1" >> $GITHUB_OUTPUT
          echo "url=staging-api-pr-${PR_NUM}.gmac.io" >> $GITHUB_OUTPUT
        fi

    - name: Build and push Docker image
      uses: docker/build-push-action@v4
      with:
        context: .
        push: true
        tags: |
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
        cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
        cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max

    - name: Deploy to K3s
      env:
        KUBECONFIG_CONTENT: ${{ secrets.KUBECONFIG }}
      run: |
        # Setup kubeconfig
        echo "$KUBECONFIG_CONTENT" | base64 -d > /tmp/kubeconfig
        export KUBECONFIG=/tmp/kubeconfig
        
        # Create deployment manifest
        cat <<EOF > deployment.yaml
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: ${{ github.event.repository.name }}
          namespace: ${{ steps.deployment.outputs.environment }}
          labels:
            app: ${{ github.event.repository.name }}
            environment: ${{ steps.deployment.outputs.environment }}
        spec:
          replicas: ${{ steps.deployment.outputs.replicas }}
          selector:
            matchLabels:
              app: ${{ github.event.repository.name }}
          template:
            metadata:
              labels:
                app: ${{ github.event.repository.name }}
            spec:
              containers:
              - name: app
                image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
                ports:
                - containerPort: 8080
                env:
                - name: PORT
                  value: "8080"
                - name: ENVIRONMENT
                  value: ${{ steps.deployment.outputs.environment }}
                resources:
                  requests:
                    memory: "64Mi"
                    cpu: "50m"
                  limits:
                    memory: "256Mi"
                    cpu: "200m"
                livenessProbe:
                  httpGet:
                    path: /health
                    port: 8080
                  initialDelaySeconds: 10
                  periodSeconds: 30
                readinessProbe:
                  httpGet:
                    path: /ready
                    port: 8080
                  initialDelaySeconds: 5
                  periodSeconds: 10
              imagePullSecrets:
              - name: gitea-registry
        ---
        apiVersion: v1
        kind: Service
        metadata:
          name: ${{ github.event.repository.name }}
          namespace: ${{ steps.deployment.outputs.environment }}
        spec:
          selector:
            app: ${{ github.event.repository.name }}
          ports:
          - port: 80
            targetPort: 8080
        ---
        apiVersion: networking.k8s.io/v1
        kind: Ingress
        metadata:
          name: ${{ github.event.repository.name }}
          namespace: ${{ steps.deployment.outputs.environment }}
          annotations:
            cert-manager.io/cluster-issuer: "letsencrypt-prod"
            nginx.ingress.kubernetes.io/ssl-redirect: "true"
            nginx.ingress.kubernetes.io/proxy-body-size: "10m"
        spec:
          ingressClassName: nginx
          tls:
          - hosts:
            - ${{ steps.deployment.outputs.url }}
            secretName: ${{ github.event.repository.name }}-tls
          rules:
          - host: ${{ steps.deployment.outputs.url }}
            http:
              paths:
              - path: /
                pathType: Prefix
                backend:
                  service:
                    name: ${{ github.event.repository.name }}
                    port:
                      number: 80
        EOF
        
        # Apply deployment
        kubectl apply -f deployment.yaml
        
        # Wait for deployment
        kubectl rollout status deployment/${{ github.event.repository.name }} \
          -n ${{ steps.deployment.outputs.environment }} \
          --timeout=300s
        
        echo "✅ API deployed to https://${{ steps.deployment.outputs.url }}"
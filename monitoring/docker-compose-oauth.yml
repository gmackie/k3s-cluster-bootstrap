version: '3.8'

networks:
  monitoring:
    driver: bridge
  gitea:
    external: true

volumes:
  prometheus_data:
  grafana_data:
  alertmanager_data:

services:
  # OAuth2 proxy for Prometheus (monitoring.gmac.io)
  oauth2-proxy-prometheus:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.5.1
    container_name: oauth2-proxy-prometheus
    restart: unless-stopped
    environment:
      OAUTH2_PROXY_CLIENT_ID: ${GITHUB_CLIENT_ID_PROMETHEUS}
      OAUTH2_PROXY_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET_PROMETHEUS}
      OAUTH2_PROXY_COOKIE_SECRET: ${COOKIE_SECRET_PROMETHEUS}
    volumes:
      - ./oauth2-proxy/prometheus.cfg:/etc/oauth2-proxy.cfg
    command:
      - --config=/etc/oauth2-proxy.cfg
    ports:
      - "4180:4180"
    networks:
      - monitoring
    depends_on:
      - prometheus

  # OAuth2 proxy for Grafana (metrics.gmac.io)  
  oauth2-proxy-grafana:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.5.1
    container_name: oauth2-proxy-grafana
    restart: unless-stopped
    environment:
      OAUTH2_PROXY_CLIENT_ID: ${GITHUB_CLIENT_ID_GRAFANA}
      OAUTH2_PROXY_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET_GRAFANA}
      OAUTH2_PROXY_COOKIE_SECRET: ${COOKIE_SECRET_GRAFANA}
    volumes:
      - ./oauth2-proxy/grafana.cfg:/etc/oauth2-proxy.cfg
    command:
      - --config=/etc/oauth2-proxy.cfg
    ports:
      - "4181:4180"
    networks:
      - monitoring
    depends_on:
      - grafana

  # OAuth2 proxy for Alertmanager (alerts.gmac.io)
  oauth2-proxy-alertmanager:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.5.1
    container_name: oauth2-proxy-alertmanager
    restart: unless-stopped
    environment:
      OAUTH2_PROXY_CLIENT_ID: ${GITHUB_CLIENT_ID_ALERTMANAGER}
      OAUTH2_PROXY_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET_ALERTMANAGER}
      OAUTH2_PROXY_COOKIE_SECRET: ${COOKIE_SECRET_ALERTMANAGER}
    volumes:
      - ./oauth2-proxy/alertmanager.cfg:/etc/oauth2-proxy.cfg
    command:
      - --config=/etc/oauth2-proxy.cfg
    ports:
      - "4182:4180"
    networks:
      - monitoring
    depends_on:
      - alertmanager

  prometheus:
    image: prom/prometheus:v2.48.1
    container_name: prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus:/etc/prometheus
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
      - '--storage.tsdb.retention.time=30d'
      - '--web.external-url=https://monitoring.gmac.io'
      - '--web.route-prefix=/'
    networks:
      - monitoring
      - gitea
    labels:
      - "prometheus.io/scrape=true"
      - "prometheus.io/port=9090"

  grafana:
    image: grafana/grafana:10.2.3
    container_name: grafana
    restart: unless-stopped
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=https://metrics.gmac.io
      - GF_SERVER_SERVE_FROM_SUB_PATH=false
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      - GF_INSTALL_PLUGINS=redis-datasource,grafana-piechart-panel
      - GF_AUTH_PROXY_ENABLED=true
      - GF_AUTH_PROXY_HEADER_NAME=X-Email
      - GF_AUTH_PROXY_HEADER_PROPERTY=email
      - GF_AUTH_PROXY_AUTO_SIGN_UP=true
    networks:
      - monitoring
    depends_on:
      - prometheus

  alertmanager:
    image: prom/alertmanager:v0.26.0
    container_name: alertmanager
    restart: unless-stopped
    volumes:
      - ./alertmanager:/etc/alertmanager
      - alertmanager_data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/config.yml'
      - '--storage.path=/alertmanager'
      - '--web.external-url=https://alerts.gmac.io'
      - '--web.route-prefix=/'
    networks:
      - monitoring

  # Node exporter for host metrics
  node-exporter:
    image: prom/node-exporter:v1.7.0
    container_name: node-exporter
    restart: unless-stopped
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - monitoring
    labels:
      - "prometheus.io/scrape=true"
      - "prometheus.io/port=9100"

  # Container metrics
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.2
    container_name: cadvisor
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - monitoring
    labels:
      - "prometheus.io/scrape=true"
      - "prometheus.io/port=8080"

  # Blackbox exporter for endpoint monitoring
  blackbox-exporter:
    image: prom/blackbox-exporter:v0.24.0
    container_name: blackbox-exporter
    restart: unless-stopped
    volumes:
      - ./exporters/blackbox:/config
    command:
      - '--config.file=/config/blackbox.yml'
    networks:
      - monitoring
    labels:
      - "prometheus.io/scrape=true"
      - "prometheus.io/port=9115"

  # Postgres exporter for Gitea database
  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.15.0
    container_name: postgres-exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://gitea:gitea@db:5432/gitea?sslmode=disable"
    networks:
      - monitoring
      - gitea
    labels:
      - "prometheus.io/scrape=true"
      - "prometheus.io/port=9187"
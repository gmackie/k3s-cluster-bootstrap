apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gitea-ingress
  namespace: default
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/auth-url: "http://oauth2-proxy.monitoring.svc.cluster.local:4180/oauth2/auth"
    nginx.ingress.kubernetes.io/auth-signin: "https://gmac.io/oauth2/start?rd=$scheme://$host$escaped_request_uri"
    nginx.ingress.kubernetes.io/auth-response-headers: "X-Auth-Request-User,X-Auth-Request-Email"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - ci.gmac.io
    secretName: ci-gmac-io-tls
  rules:
  - host: ci.gmac.io
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: gitea
            port:
              number: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: gitea
  namespace: default
spec:
  type: ExternalName
  externalName: 5.78.92.8
  ports:
  - port: 3000
    targetPort: 3000
---
apiVersion: v1 
kind: Endpoints
metadata:
  name: gitea
  namespace: default
subsets:
- addresses:
  - ip: 5.78.92.8
  ports:
  - port: 3000
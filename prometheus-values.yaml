grafana:
  adminPassword: admin  # Change this!
  ingress:
    enabled: true
    ingressClassName: nginx
    annotations:
      cert-manager.io/cluster-issuer: "letsencrypt-prod"
    hosts:
      - grafana.gmac.io
    tls:
      - secretName: grafana-tls
        hosts:
          - grafana.gmac.io

prometheus:
  ingress:
    enabled: true
    ingressClassName: nginx

name: Build and Deploy

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  # CONFIGURE THESE FOR YOUR APP
  APP_NAME: ${{ github.event.repository.name }}
  APP_DOMAIN: "" # Set this in your repository settings or workflow file
  APP_PORT: "3000" # Default port, change if needed
  REGISTRY: registry.gmac.io
  REGISTRY_NAMESPACE: apps

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Generate deployment vars
      id: vars
      run: |
        # Use repo name as default if APP_DOMAIN not set
        if [ -z "${{ env.APP_DOMAIN }}" ]; then
          echo "domain=${{ env.APP_NAME }}.gmac.io" >> $GITHUB_OUTPUT
        else
          echo "domain=${{ env.APP_DOMAIN }}" >> $GITHUB_OUTPUT
        fi
        echo "image=${{ env.REGISTRY }}/${{ env.REGISTRY_NAMESPACE }}/${{ env.APP_NAME }}" >> $GITHUB_OUTPUT
        echo "tag=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT

    - name: Build and push Docker image
      run: |
        # Check if Dockerfile exists, if not create a default one
        if [ ! -f Dockerfile ]; then
          echo "No Dockerfile found, detecting application type..."
          
          if [ -f package.json ]; then
            echo "Detected Node.js application"
            cat > Dockerfile << 'EOF'
        FROM node:18-alpine AS builder
        WORKDIR /app
        COPY package*.json ./
        RUN npm ci
        COPY . .
        RUN npm run build || true

        FROM node:18-alpine
        WORKDIR /app
        COPY --from=builder /app .
        EXPOSE ${{ env.APP_PORT }}
        CMD ["npm", "start"]
        EOF
          elif [ -f requirements.txt ]; then
            echo "Detected Python application"
            cat > Dockerfile << 'EOF'
        FROM python:3.11-slim
        WORKDIR /app
        COPY requirements.txt .
        RUN pip install --no-cache-dir -r requirements.txt
        COPY . .
        EXPOSE ${{ env.APP_PORT }}
        CMD ["python", "app.py"]
        EOF
          elif [ -f go.mod ]; then
            echo "Detected Go application"
            cat > Dockerfile << 'EOF'
        FROM golang:1.21-alpine AS builder
        WORKDIR /app
        COPY go.* ./
        RUN go mod download
        COPY . .
        RUN go build -o app .

        FROM alpine:latest
        RUN apk --no-cache add ca-certificates
        WORKDIR /root/
        COPY --from=builder /app/app .
        EXPOSE ${{ env.APP_PORT }}
        CMD ["./app"]
        EOF
          else
            echo "Could not detect application type, using generic static file server"
            cat > Dockerfile << 'EOF'
        FROM nginx:alpine
        COPY . /usr/share/nginx/html
        EXPOSE 80
        EOF
            echo "APP_PORT=80" >> $GITHUB_ENV
          fi
        fi
        
        # Build and push image
        docker build -t ${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.tag }} .
        docker tag ${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.tag }} ${{ steps.vars.outputs.image }}:latest
        docker push ${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.tag }}
        docker push ${{ steps.vars.outputs.image }}:latest

    - name: Generate Kubernetes manifests
      run: |
        mkdir -p k8s
        
        # Generate deployment manifest
        cat > k8s/deployment.yaml << EOF
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: ${{ env.APP_NAME }}
          labels:
            app: ${{ env.APP_NAME }}
            app.kubernetes.io/name: ${{ env.APP_NAME }}
            app.kubernetes.io/instance: ${{ env.APP_NAME }}
            app.kubernetes.io/managed-by: argocd
        spec:
          replicas: 1
          selector:
            matchLabels:
              app: ${{ env.APP_NAME }}
          template:
            metadata:
              labels:
                app: ${{ env.APP_NAME }}
            spec:
              containers:
              - name: ${{ env.APP_NAME }}
                image: ${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.tag }}
                ports:
                - containerPort: ${{ env.APP_PORT }}
                  name: http
                env:
                - name: PORT
                  value: "${{ env.APP_PORT }}"
                livenessProbe:
                  httpGet:
                    path: /
                    port: http
                  initialDelaySeconds: 30
                  periodSeconds: 10
                readinessProbe:
                  httpGet:
                    path: /
                    port: http
                  initialDelaySeconds: 5
                  periodSeconds: 5
                resources:
                  requests:
                    cpu: 50m
                    memory: 128Mi
                  limits:
                    cpu: 500m
                    memory: 512Mi
        EOF
        
        # Generate service manifest
        cat > k8s/service.yaml << EOF
        apiVersion: v1
        kind: Service
        metadata:
          name: ${{ env.APP_NAME }}
          labels:
            app: ${{ env.APP_NAME }}
        spec:
          type: ClusterIP
          selector:
            app: ${{ env.APP_NAME }}
          ports:
          - port: 80
            targetPort: http
            protocol: TCP
            name: http
        EOF
        
        # Generate ingress manifest
        cat > k8s/ingress.yaml << EOF
        apiVersion: networking.k8s.io/v1
        kind: Ingress
        metadata:
          name: ${{ env.APP_NAME }}
          labels:
            app: ${{ env.APP_NAME }}
          annotations:
            cert-manager.io/cluster-issuer: letsencrypt-prod
            nginx.ingress.kubernetes.io/ssl-redirect: "true"
        spec:
          ingressClassName: nginx
          tls:
          - hosts:
            - ${{ steps.vars.outputs.domain }}
            secretName: ${{ env.APP_NAME }}-tls
          rules:
          - host: ${{ steps.vars.outputs.domain }}
            http:
              paths:
              - path: /
                pathType: Prefix
                backend:
                  service:
                    name: ${{ env.APP_NAME }}
                    port:
                      number: 80
        EOF
        
        # Generate ArgoCD application manifest
        cat > k8s/argocd-app.yaml << EOF
        apiVersion: argoproj.io/v1alpha1
        kind: Application
        metadata:
          name: ${{ env.APP_NAME }}
          namespace: argocd
          labels:
            app.kubernetes.io/name: ${{ env.APP_NAME }}
            auto-deploy: "true"
          finalizers:
          - resources-finalizer.argocd.argoproj.io
        spec:
          project: default
          source:
            repoURL: https://git.gmac.io/${{ github.repository }}
            targetRevision: HEAD
            path: k8s
          destination:
            server: https://kubernetes.default.svc
            namespace: ${{ env.APP_NAME }}
          syncPolicy:
            automated:
              prune: true
              selfHeal: true
            syncOptions:
            - CreateNamespace=true
        EOF

    - name: Commit deployment manifests
      run: |
        git config user.name "GitHub Actions"
        git config user.email "actions@gmac.io"
        git add k8s/
        git diff --staged --quiet || git commit -m "Update deployment manifests for ${{ steps.vars.outputs.tag }}"
        git push

    - name: Sync ArgoCD application
      run: |
        # This will work once ArgoCD picks up the application
        echo "Deployment manifests pushed. ArgoCD will auto-sync the application."
        echo "Application will be available at: https://${{ steps.vars.outputs.domain }}"
apiVersion: v1
kind: Service
metadata:
  name: mumble-tcp
  namespace: mumble
spec:
  type: LoadBalancer
  selector:
    app: mumble
  ports:
  - name: tcp
    port: 64738
    targetPort: 64738
    protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: mumble-udp
  namespace: mumble
spec:
  type: LoadBalancer
  selector:
    app: mumble
  ports:
  - name: udp
    port: 64738
    targetPort: 64738
    protocol: UDP
---
# ClusterIP service for internal access
apiVersion: v1
kind: Service
metadata:
  name: mumble
  namespace: mumble
spec:
  type: ClusterIP
  selector:
    app: mumble
  ports:
  - name: tcp
    port: 64738
    targetPort: 64738
    protocol: TCP
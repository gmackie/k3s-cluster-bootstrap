apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mastodon-postgres-pvc
  namespace: mastodon
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
  storageClassName: local-path
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mastodon-postgres
  namespace: mastodon
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mastodon-postgres
  template:
    metadata:
      labels:
        app: mastodon-postgres
    spec:
      containers:
      - name: postgres
        image: postgres:15-alpine
        env:
        - name: POSTGRES_USER
          value: mastodon
        - name: POSTGRES_DB
          value: mastodon_production
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mastodon-secrets
              key: postgres-password
        ports:
        - containerPort: 5432
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
      volumes:
      - name: postgres-data
        persistentVolumeClaim:
          claimName: mastodon-postgres-pvc
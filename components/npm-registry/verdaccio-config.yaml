apiVersion: v1
kind: ConfigMap
metadata:
  name: verdaccio-config
  namespace: npm-registry
data:
  config.yaml: |
    # Verdaccio configuration
    storage: /verdaccio/storage
    plugins: /verdaccio/plugins
    
    web:
      title: GMAC.io Private NPM Registry
      enable: true
      
    auth:
      # Trust authentication from proxy headers
      auth-proxy:
        header: X-Auth-Request-Email
        
    uplinks:
      npmjs:
        url: https://registry.npmjs.org/
        
    packages:
      '@gmac/*':
        # Allow all authenticated users to read/write private packages
        access: $authenticated
        publish: $authenticated
        unpublish: $authenticated
        
      '@*/*':
        # Scoped packages (except @gmac)
        access: $all
        publish: $authenticated
        unpublish: $authenticated
        proxy: npmjs
        
      '**':
        # All other packages
        access: $all
        publish: $authenticated
        unpublish: $authenticated
        proxy: npmjs
        
    server:
      keepAliveTimeout: 60
      
    middlewares:
      audit:
        enabled: true
        
    logs:
      - type: stdout
        format: pretty
        level: warn
        
    # Maximum package size
    max_body_size: 100mb
    
    # Security
    security:
      api:
        jwt:
          sign:
            expiresIn: 60d
            notBefore: 1
      web:
        sign:
          expiresIn: 7d
          
    # Listen on all interfaces
    listen: 0.0.0.0:4873
    
    # URL prefix for npm commands
    url_prefix: /
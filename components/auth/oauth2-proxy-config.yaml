apiVersion: v1
kind: ConfigMap
metadata:
  name: oauth2-proxy-config
  namespace: auth-system
data:
  oauth2-proxy.cfg: |
    # Provider config
    provider = "github"
    client_id = "${GITHUB_CLIENT_ID}"
    client_secret = "${GITHUB_CLIENT_SECRET}"
    
    # Cookie config
    cookie_secret = "${OAUTH2_PROXY_COOKIE_SECRET}"
    cookie_secure = true
    cookie_httponly = true
    cookie_name = "_oauth2_proxy"
    cookie_expire = "24h"
    cookie_refresh = "60m"
    cookie_domains = [".${DOMAIN}"]
    
    # URLs
    redirect_url = "https://${DOMAIN}/oauth2/callback"
    
    # Upstream config
    upstreams = ["static://202"]
    
    # Email domains (accept all authenticated users)
    email_domains = ["*"]
    
    # GitHub restrictions (optional)
    ${GITHUB_ORG:+github_org = "${GITHUB_ORG}"}
    ${GITHUB_USER:+github_user = "${GITHUB_USER}"}
    
    # Session config
    session_store_type = "cookie"
    
    # HTTP config
    http_address = "0.0.0.0:4180"
    
    # Logging
    standard_logging = true
    auth_logging = true
    request_logging = true
    
    # Security
    skip_provider_button = false
    pass_authorization_header = true
    pass_access_token = true
    pass_user_headers = true
    set_xauthrequest = true
    set_authorization_header = true
    
    # Whitelist paths that don't require auth
    skip_auth_regex = [
      "^/oauth2",
      "^/ping",
      "^/healthz",
      "^/metrics"
    ]
    
    # Additional settings
    reverse_proxy = true
    real_client_ip_header = "X-Real-IP"
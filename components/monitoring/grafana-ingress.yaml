apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana
  namespace: monitoring
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    # OAuth2 authentication
    nginx.ingress.kubernetes.io/auth-url: "http://oauth2-proxy.auth-system.svc.cluster.local:4180/oauth2/auth"
    nginx.ingress.kubernetes.io/auth-signin: "https://${DOMAIN}/oauth2/start?rd=$scheme://$host$escaped_request_uri"
    nginx.ingress.kubernetes.io/auth-response-headers: "X-Auth-Request-User,X-Auth-Request-Email,X-Auth-Request-Access-Token"
    # Pass auth headers to Grafana
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_set_header X-WEBAUTH-USER $upstream_http_x_auth_request_user;
      proxy_set_header X-WEBAUTH-EMAIL $upstream_http_x_auth_request_email;
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - metrics.${DOMAIN}
    secretName: grafana-tls
  rules:
  - host: metrics.${DOMAIN}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: grafana
            port:
              number: 3000
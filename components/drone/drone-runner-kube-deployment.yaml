apiVersion: apps/v1
kind: Deployment
metadata:
  name: drone-runner-kube
  namespace: drone
spec:
  replicas: 1
  selector:
    matchLabels:
      app: drone-runner-kube
  template:
    metadata:
      labels:
        app: drone-runner-kube
    spec:
      serviceAccountName: drone-runner-kube
      containers:
      - name: drone-runner-kube
        image: drone/drone-runner-kube:latest
        ports:
        - containerPort: 3000
          name: http
        env:
        - name: DRONE_RPC_PROTO
          value: "https"
        - name: DRONE_RPC_HOST
          value: "ci.${DOMAIN}"
        - name: DRONE_RPC_SECRET
          valueFrom:
            secretKeyRef:
              name: drone-secrets
              key: rpc-secret
        - name: DRONE_NAMESPACE_DEFAULT
          value: "drone"
        - name: DRONE_RUNNER_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: DRONE_DEBUG
          value: "false"
        - name: DRONE_TRACE
          value: "false"
        - name: DRONE_RESOURCE_REQUEST_CPU
          value: "100m"
        - name: DRONE_RESOURCE_REQUEST_MEMORY
          value: "128Mi"
        - name: DRONE_RESOURCE_LIMIT_CPU
          value: "2000m"
        - name: DRONE_RESOURCE_LIMIT_MEMORY
          value: "2Gi"
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "500m"
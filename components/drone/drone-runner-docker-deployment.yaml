apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: drone-runner-cache
  namespace: drone
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
  storageClassName: local-path
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: drone-runner-docker
  namespace: drone
spec:
  replicas: 2
  selector:
    matchLabels:
      app: drone-runner-docker
  template:
    metadata:
      labels:
        app: drone-runner-docker
    spec:
      containers:
      - name: drone-runner-docker
        image: drone/drone-runner-docker:1
        ports:
        - containerPort: 3000
          name: http
        env:
        - name: DRONE_RPC_PROTO
          value: "https"
        - name: DRONE_RPC_HOST
          value: "ci.${DOMAIN}"
        - name: DRONE_RPC_SECRET
          valueFrom:
            secretKeyRef:
              name: drone-secrets
              key: rpc-secret
        - name: DRONE_RUNNER_CAPACITY
          value: "2"
        - name: DRONE_RUNNER_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: DRONE_RUNNER_NETWORKS
          value: "drone"
        - name: DRONE_DEBUG
          value: "false"
        - name: DRONE_TRACE
          value: "false"
        volumeMounts:
        - name: docker-socket
          mountPath: /var/run/docker.sock
        - name: runner-cache
          mountPath: /tmp/cache
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "2Gi"
            cpu: "2000m"
        securityContext:
          privileged: true
      volumes:
      - name: docker-socket
        hostPath:
          path: /var/run/docker.sock
          type: Socket
      - name: runner-cache
        persistentVolumeClaim:
          claimName: drone-runner-cache
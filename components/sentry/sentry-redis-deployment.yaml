apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentry-redis
  namespace: sentry
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sentry-redis
  template:
    metadata:
      labels:
        app: sentry-redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
          name: redis
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          tcpSocket:
            port: 6379
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          exec:
            command:
            - redis-cli
            - ping
          initialDelaySeconds: 5
          periodSeconds: 5
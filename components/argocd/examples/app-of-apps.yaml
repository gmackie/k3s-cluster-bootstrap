# App of Apps pattern - manages all applications
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: applications
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://git.${DOMAIN}/gitops/applications.git
    targetRevision: HEAD
    path: apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
---
# Example structure for applications repo:
# apps/
# ├── frontend/
# │   └── application.yaml
# ├── backend/
# │   └── application.yaml
# └── database/
#     └── application.yaml
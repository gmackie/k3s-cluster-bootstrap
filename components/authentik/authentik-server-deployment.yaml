apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: authentik-media
  namespace: authentik
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: ${STORAGE_CLASS:-local-path}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: authentik-server
  namespace: authentik
spec:
  replicas: 2
  selector:
    matchLabels:
      app: authentik-server
  template:
    metadata:
      labels:
        app: authentik-server
    spec:
      initContainers:
      - name: authentik-migrate
        image: ghcr.io/goauthentik/server:2023.10.5
        command:
        - python
        - -m
        - lifecycle.migrate
        envFrom:
        - configMapRef:
            name: authentik-config
        env:
        - name: AUTHENTIK_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: authentik-secrets
              key: secret-key
        - name: AUTHENTIK_POSTGRESQL__PASSWORD
          valueFrom:
            secretKeyRef:
              name: authentik-secrets
              key: postgres-password
        - name: AUTHENTIK_REDIS__PASSWORD
          valueFrom:
            secretKeyRef:
              name: authentik-secrets
              key: redis-password
        - name: AUTHENTIK_EMAIL__PASSWORD
          value: "${SMTP_PASSWORD:-}"
        volumeMounts:
        - name: media
          mountPath: /media
      containers:
      - name: authentik-server
        image: ghcr.io/goauthentik/server:2023.10.5
        ports:
        - containerPort: 9000
          name: http
        - containerPort: 9443
          name: https
        envFrom:
        - configMapRef:
            name: authentik-config
        env:
        - name: AUTHENTIK_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: authentik-secrets
              key: secret-key
        - name: AUTHENTIK_POSTGRESQL__PASSWORD
          valueFrom:
            secretKeyRef:
              name: authentik-secrets
              key: postgres-password
        - name: AUTHENTIK_REDIS__PASSWORD
          valueFrom:
            secretKeyRef:
              name: authentik-secrets
              key: redis-password
        - name: AUTHENTIK_EMAIL__PASSWORD
          value: "${SMTP_PASSWORD:-}"
        - name: AUTHENTIK_BOOTSTRAP_PASSWORD
          valueFrom:
            secretKeyRef:
              name: authentik-secrets
              key: bootstrap-password
        - name: AUTHENTIK_BOOTSTRAP_TOKEN
          valueFrom:
            secretKeyRef:
              name: authentik-secrets
              key: bootstrap-token
        volumeMounts:
        - name: media
          mountPath: /media
        - name: templates
          mountPath: /templates
        resources:
          requests:
            memory: "512Mi"
            cpu: "100m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /-/health/live/
            port: 9000
          initialDelaySeconds: 60
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /-/health/ready/
            port: 9000
          initialDelaySeconds: 30
          periodSeconds: 10
      volumes:
      - name: media
        persistentVolumeClaim:
          claimName: authentik-media
      - name: templates
        emptyDir: {}
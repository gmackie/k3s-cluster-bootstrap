# Moodle PostgreSQL Database
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: moodle-postgres-pvc
  namespace: moodle
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: longhorn
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: moodle-postgres
  namespace: moodle
spec:
  replicas: 1
  selector:
    matchLabels:
      app: moodle-postgres
  template:
    metadata:
      labels:
        app: moodle-postgres
    spec:
      containers:
      - name: postgres
        image: postgres:15-alpine
        ports:
        - containerPort: 5432
          name: postgres
        env:
        - name: POSTGRES_USER
          value: "moodle"
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: moodle-secrets
              key: postgres-password
        - name: POSTGRES_DB
          value: "moodle"
        - name: PGDATA
          value: "/var/lib/postgresql/data/pgdata"
        volumeMounts:
        - name: postgres-storage
          mountPath: /var/lib/postgresql/data
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          exec:
            command: ["pg_isready", "-U", "moodle"]
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          exec:
            command: ["pg_isready", "-U", "moodle"]
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: postgres-storage
        persistentVolumeClaim:
          claimName: moodle-postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: moodle-postgres
  namespace: moodle
spec:
  selector:
    app: moodle-postgres
  ports:
  - port: 5432
    targetPort: 5432

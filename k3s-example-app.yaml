# Example Next.js App Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: example-nextjs
  namespace: production
spec:
  replicas: 2
  selector:
    matchLabels:
      app: example-nextjs
  template:
    metadata:
      labels:
        app: example-nextjs
    spec:
      containers:
      - name: nextjs
        image: ci.gmac.io/mackieg/example-nextjs:latest
        ports:
        - containerPort: 3000
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        env:
        - name: NODE_ENV
          value: "production"
      imagePullSecrets:
      - name: gitea-registry
---
apiVersion: v1
kind: Service
metadata:
  name: example-nextjs
  namespace: production
spec:
  selector:
    app: example-nextjs
  ports:
  - port: 80
    targetPort: 3000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: example-nextjs
  namespace: production
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - app.gmac.io
    secretName: app-gmac-io-tls
  rules:
  - host: app.gmac.io
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: example-nextjs
            port:
              number: 80
version: '3'

services:
  gitea:
    image: gitea/gitea:1.21.3
    container_name: gitea
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - GITEA__database__DB_TYPE=postgres
      - GITEA__database__HOST=db:5432
      - GITEA__database__NAME=gitea
      - GITEA__database__USER=gitea
      - GITEA__database__PASSWD=gitea
      - GITEA__actions__ENABLED=true
    restart: always
    networks:
      - gitea
    volumes:
      - ./gitea:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "3000:3000"
      - "222:22"
    depends_on:
      - db

  db:
    image: postgres:15
    restart: always
    environment:
      - POSTGRES_USER=gitea
      - POSTGRES_PASSWORD=gitea
      - POSTGRES_DB=gitea
    networks:
      - gitea
    volumes:
      - ./postgres:/var/lib/postgresql/data

  runner:
    image: gitea/act_runner:latest
    container_name: gitea_runner
    restart: always
    depends_on:
      - gitea
    volumes:
      - ./runner:/data
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - GITEA_INSTANCE_URL=http://gitea:3000
      - GITEA_RUNNER_REGISTRATION_TOKEN=${RUNNER_TOKEN}
      - GITEA_RUNNER_NAME=docker-runner
      - GITEA_RUNNER_LABELS=ubuntu-latest:docker://node:18-bullseye,ubuntu-22.04:docker://ubuntu:22.04
    networks:
      - gitea

  # Docker Registry Browser for Gitea's container registry
  registry-browser:
    image: klausmeyer/docker-registry-browser:1.7.1
    container_name: registry-browser
    restart: always
    environment:
      DOCKER_REGISTRY_URL: https://ci.gmac.io
      NO_SSL_VERIFICATION: "true"
      # Use Gitea credentials for authentication
      ENABLE_DELETE_IMAGES: "true"
      PUBLIC_REGISTRY_URL: ci.gmac.io
      # Token authentication will be required
      TOKEN_AUTH_USER: ${GITEA_REGISTRY_USER:-gitea}
      TOKEN_AUTH_PASSWORD: ${GITEA_REGISTRY_TOKEN}
    ports:
      - "8081:8080"
    networks:
      - gitea

networks:
  gitea:
    external: false